name: CI

# Der Merge-Gate. Selbst-Merge ist nur bei gruenem CI erlaubt — auf Pull
# Requests lief bisher aber gar kein Check, den es haette gruen oder rot
# machen koennen: release.yml haengt an Tags.
#
# Geprueft wird, was ein Beitragender lokal auch laeuft: Lint, Build (der
# `tsc -b` einschliesst, also den Type-Check) und die Tests. electron-builder
# bleibt draussen — das gehoert zu release.yml und braucht Signatur-Material.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build (inkl. Type-Check)
        run: npm run build

      # Beide Dokumente unter docs/ waren bis 2026-09-04 von keiner
      # Einstiegsseite aus verlinkt. Ein Dokument, das nur findet, wer den
      # Ordner durchblaettert, ist praktisch nicht vorhanden.
      - name: Dokumentation ist auffindbar
        run: npm run docs:reachable

      # Quellsprache (E-17/E-20): dieses Repo ist englisch-quellig. Der Lauf
      # haelt heute nur die Deklaration zusammen — upstream gibt es noch keine
      # i18n, an der sich etwas messen liesse (B-25). Er schaltet sich selbst
      # scharf, sobald der erste Fallback in src/ steht.
      - name: Quellsprache ist erklaert und stimmt ueberein
        run: npm run lang:check
      # B-25, Rueckweg: WIE VIEL ist es noch? Der Lauf zaehlt die sichtbaren
      # Zeichenketten dieses Repos, die in der zweisprachigen Suite-Kopie
      # keine Entsprechung haben — weder als englischer Quell-String noch als
      # deutscher Dict-Eintrag. Gemessen sind es 76 von 632; der Rest steht
      # drueben schon und laesst sich uebernehmen.
      #
      # Er MELDET und urteilt nicht: eine Zahl, die heute rot ist und erst
      # nach Tagen Arbeit gruen wird, waere der Dauer-Rotzustand, gegen den
      # die anderen Waechter hier geschrieben sind. Ohne die Suite-Kopie
      # daneben misst er nichts und sagt das.
      - name: Rueckweg der Uebersetzung — wie viel fehlt noch?
        run: npm run i18n:check

      # Nutzer-Rueckmeldung 2026-09-07: "die ui ist nicht konsistent. lege
      # globale ui regeln fest die fuer alle repos gelten." Die Regeln stehen
      # in ADR-007 der av-planner-suite; dieser Check haelt sie hier.
      - name: Oberflaechen-Regeln (ADR-007)
        run: npm run brand:check

      # Nutzer-Auftrag 2026-09-11: "Stelle sicher das in allen repos
      # uebergreifend das Einstellungen Menue an der gleichen Stelle ist wie
      # im Cable planner und das die obere Menueleiste gleich aufgebaut ist."
      # Der uebergreifende Massstab liegt in der Suite (chrome-parity.mjs);
      # dieser Lauf ist die Haelfte, die im Repo mitwandert.
      - name: Kopfzeile im Schnitt der Suite (ADR-007 Abschnitt 6)
        run: npm run kopfzeile:check

      # B-70 — das Hell-Thema haelt nur, solange `src/` keine rohe
      # Farb-Utility mehr traegt. Bis zum 2026-09-11 waren es 406; solange
      # die App nur dunkel war, sah man ihnen nichts an, und genau deshalb
      # konnten es 406 werden. Wer im Dunkel-Thema arbeitet — also fast
      # jeder, der hier etwas baut — merkt einen Rueckfall nie.
      - name: Keine rohen Farben (B-70)
        run: npm run farben:check

      # Die FORM (ADR-007 Abschnitt 3): keine Rundungen, keine Schatten.
      # `brand:check` gab es laengst — er las aber nur `src/index.css`, und
      # die 237 Rundungen standen als Tailwind-Utilities im JSX. Ein
      # Waechter, der die eine Haelfte prueft und die andere nicht erwaehnt,
      # liest sich wie eine Zusage fuer beide.
      - name: Keine Rundungen/Schatten (ADR-007)
        run: npm run form:check

      # Fragt die action.yml jedes Pins nach ihrer Node-Version, statt sie in
      # einem Kommentar zu behaupten. Am 2026-09-05 liefen in `release.yml`
      # drei Actions auf node20, und der Kommentar daneben begruendete das mit
      # einem Stand, den es nicht mehr gab. Der Lauf folgt eine Ebene in
      # Composite-Actions hinein -- dort steckt node20 sonst unsichtbar drin.
      - name: Actions laufen auf einer unterstuetzten Node-Version
        run: npm run actions:check
